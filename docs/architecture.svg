<text x="64" y="1006" class="section" >03  本地模型部署</text>
<text x="302" y="1006" class="note" >HTTP适配器隔离服务地址与模型接口；图示为当前部署分工</text>
<rect x="64" y="1024" width="544" height="250" rx="16" fill="#FFFFFF" stroke="#DDE4ED"/>
