<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1360" viewBox="0 0 1920 1360" role="img" aria-labelledby="title desc">
<title id="title">保险条款问答系统架构</title>
<desc id="desc">离线从官方PDF构建按条款分支切分的证据库和混合索引。在线经过意图分流、查询规划、混合检索、证据补齐、答案生成、程序校验和同模型复核，输出答案及PDF出处。程序直接处理常见问候并对信息不足提出必要追问。卡2运行意图、向量和重排模型，卡5独立运行Qwen3.5-27B，应用通过HTTP适配器调用模型。</desc>
