<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">保险条款问答：数据、模型与规则的分工</title>
  <desc id="desc">官方条款按完整责任分支切分并保存原文位置，建立关键词和向量索引。用户问题经过有原话约束的改写、混合检索和重排、必要证据补齐，再生成草稿。程序检查与模型复核通过后显示答案和原文出处；可修复的首次程序校验错误最多重新生成一次。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <style>
      text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#182c43}
      .title{font-size:38px;font-weight:700}.sub{font-size:22px;fill:#5a6c80}
      .section{font-size:24px;font-weight:700}.head{font-size:25px;font-weight:700}
      .body{font-size:21px}.small{font-size:19px;fill:#4c6076}
      .box{stroke-width:1.5;rx:16}.rule{fill:#eef8f3;stroke:#90bfa9}.model{fill:#edf3ff;stroke:#91aedb}.data{fill:#f5f7fa;stroke:#b6c2d0}
      .line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#ffffff"/>
  <text x="60" y="65" class="title">保险条款问答｜一页架构</text>
  <text x="60" y="105" class="sub">Python 模块化单体 · 本地模型 · 原问可追溯 · 答案回查官方 PDF</text>
  <rect x="1130" y="48" width="22" height="22" class="model box"/><text x="1165" y="68" class="body">模型处理语义</text>
  <rect x="1340" y="48" width="22" height="22" class="rule box"/><text x="1375" y="68" class="body">程序约束边界</text>

  <text x="60" y="165" class="section">离线数据：按完整规则切分，保留出处</text>
  <rect x="60" y="190" width="330" height="140" class="data box"/>
  <text x="84" y="230" class="head">官方 PDF → 逐页原文</text>
  <text x="84" y="267" class="body">来源 URL、文件哈希、物理页</text>
  <text x="84" y="300" class="small">默认仅使用保险条款</text>
  <path d="M390 260 H430" class="line"/>
  <rect x="440" y="190" width="580" height="140" class="rule box"/>
  <text x="464" y="230" class="head">章节／责任分支 → 证据库</text>
  <text x="464" y="267" class="body">短节整段；复杂责任按人数、原因、时间拆分</text>
  <text x="464" y="300" class="small">条件、定义、引用关系完整保留；绑定原文字符位置</text>
  <path d="M1020 260 H1060" class="line"/>
  <rect x="1070" y="190" width="470" height="140" class="data box"/>
  <text x="1094" y="230" class="head">BM25 ＋ 向量索引</text>
  <text x="1094" y="267" class="body">121 个检索单元 · 1024 维向量</text>
  <text x="1094" y="300" class="small">索引绑定语料版本；不把评测答案入库</text>

  <text x="60" y="390" class="section">在线问答：先明确目标，再检索与核对</text>
  <rect x="60" y="420" width="200" height="175" class="data box"/>
  <text x="82" y="460" class="head">① 用户输入</text>
  <text x="82" y="499" class="body">网页／API／CLI</text>
  <text x="82" y="535" class="body">原问＋用户历史</text>
  <text x="82" y="570" class="small">常见寒暄直接回复</text>
  <path d="M260 505 H290" class="line"/>
  <rect x="300" y="420" width="280" height="175" class="model box"/>
  <text x="324" y="460" class="head">② 意图与查询规划</text>
  <text x="324" y="499" class="body">先分流身份／闲聊</text>
  <text x="324" y="535" class="body">规则／模型规划保险目标</text>
  <text x="324" y="570" class="small">保留原问；最多 3 条改写</text>
  <path d="M580 505 H610" class="line"/>
  <rect x="620" y="420" width="400" height="175" class="model box"/>
  <text x="644" y="460" class="head">③ 混合检索与重排</text>
  <text x="644" y="499" class="body">BM25／向量各取 20 条</text>
  <text x="644" y="535" class="body">分组 RRF → 重排 → Top 8</text>
  <text x="644" y="570" class="small">程序先过滤来源、按稳定 ID 去重</text>
  <path d="M1020 505 H1050" class="line"/>
  <rect x="1060" y="420" width="480" height="175" class="rule box"/>
  <text x="1084" y="460" class="head">④ 补齐证据与必要追问</text>
  <text x="1084" y="499" class="body">主条款＋条件＋定义＋原文出处</text>
  <text x="1084" y="535" class="body">缺关键个人条件：每轮最多追问一个</text>
  <text x="1084" y="570" class="small">完整组计数；不截断必要前提</text>
  <path d="M1300 595 V635" class="line"/>

  <rect x="1060" y="645" width="480" height="175" class="model box"/>
  <text x="1084" y="685" class="head">⑤ 生成结构化草稿</text>
  <text x="1084" y="724" class="body">按原问目标，只用当前证据</text>
  <text x="1084" y="760" class="body">每条结论附条件、例外与引用 ID</text>
  <text x="1084" y="795" class="small">个人精确金额与办理操作未开放</text>
  <path d="M1060 730 H1030" class="line"/>
  <rect x="620" y="645" width="400" height="175" class="rule box"/>
  <text x="644" y="685" class="head">⑥ 校验 ＋ 独立请求复核</text>
  <text x="644" y="724" class="body">程序：结构／出处／依赖／边界</text>
  <text x="644" y="760" class="body">模型：原文支持性与目标覆盖</text>
  <text x="644" y="795" class="small">同模型复核仍可能漏错，需离线评测</text>
  <path d="M620 730 H590" class="line"/>
  <rect x="60" y="645" width="520" height="175" class="data box"/>
  <text x="84" y="685" class="head">⑦ 答案、出处与未完成目标</text>
  <text x="84" y="724" class="body">验证后的正文 → 点击原文与 PDF 页</text>
  <text x="84" y="760" class="body">区分完整回答、部分回答、追问与失败</text>
  <text x="84" y="795" class="small">程序渲染出处；不能用引用存在代替答案正确</text>
  <path d="M820 820 V870 H1300 V830" class="line" stroke-dasharray="8 6"/>
  <rect x="885" y="848" width="360" height="40" rx="8" fill="#ffffff"/>
  <text x="900" y="876" class="small">可修复的首次程序错误：最多修正一次</text>

  <rect x="60" y="930" width="1480" height="120" rx="16" fill="#f5f7fa" stroke="#d4dce5"/>
  <text x="84" y="970" class="head">模型部署与约束</text>
  <text x="350" y="970" class="body">卡 2：意图 Qwen3-1.7B · 向量／重排 Qwen3-0.6B</text>
  <text x="350" y="1010" class="body">卡 5：Qwen3.5-27B 规划／回答／复核 · 8192 上下文 · 整轮 90 秒</text>
  <text x="84" y="1010" class="small">HTTP 适配器隔离模型接口</text>
</svg>
