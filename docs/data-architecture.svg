<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#167B77" stroke-width="1.6"/></marker>
<marker id="soft" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#8493AA" stroke-width="1.5"/></marker>
<style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#20334B}.title{font-size:40px;font-weight:700}.sub{font-size:21px;fill:#697A90}.section{font-size:21px;font-weight:700}.head{font-size:24px;font-weight:700}.body{font-size:19px}.note{font-size:16px;fill:#697A90}.file{font-size:16px;fill:#697A90}.flow{fill:none;stroke:#167B77;stroke-width:2.5;stroke-linejoin:round;marker-end:url(#arrow)}.ref{fill:none;stroke:#8493AA;stroke-width:2;stroke-dasharray:6 5;stroke-linejoin:round;marker-end:url(#soft)}</style></defs>
<rect width="1600" height="1000" fill="#F6F8FC"/>
<title id="title">保险条款问答｜数据存储架构</title>
<desc id="desc">知识库与索引保存在本地文件中；会话状态保存在进程内存中</desc>
<text x="64" y="85" class="title">保险条款问答｜数据存储架构</text>
<text x="64" y="128" class="sub">知识库与索引保存在本地文件中；会话状态保存在进程内存中</text>
<rect x="64" y="190" width="320" height="220" rx="16" fill="#EDF2F8" stroke="#DCE4EE"/>
<text x="84" y="232" class="head" data-end-x="364">原始文档</text>
<text x="84" y="259" class="file" data-end-x="364">sources.json / PDF / manifest</text>
<text x="84" y="294" class="body" data-end-x="364">文档标识：id</text>
<text x="84" y="326" class="body" data-end-x="364">产品名称 · 官方来源URL</text>
<text x="84" y="358" class="body" data-end-x="364">PDF文件与来源哈希</text>
<rect x="64" y="480" width="320" height="220" rx="16" fill="#EDF2F8" stroke="#DCE4EE"/>
<text x="84" y="522" class="head" data-end-x="364">逐页原文</text>
<text x="84" y="549" class="file" data-end-x="364">data/pages/*.pages.jsonl</text>
<text x="84" y="584" class="body" data-end-x="364">document_id ＋ page</text>
<text x="84" y="616" class="body" data-end-x="364">原文文本 text</text>
<text x="84" y="648" class="body" data-end-x="364">用于定位与完整性校验</text>
<rect x="512" y="190" width="528" height="220" rx="16" fill="#E8F3EF" stroke="#DCE4EE"/>
<text x="532" y="232" class="head" data-end-x="1020">证据单元</text>
<text x="532" y="259" class="file" data-end-x="1020">evidence_units.jsonl</text>
<text x="532" y="294" class="body" data-end-x="1020">evidence_unit_id：证据标识</text>
<text x="532" y="326" class="body" data-end-x="1020">章节 / 标题 / 正文 / 检索文本</text>
<text x="532" y="358" class="body" data-end-x="1020">source_span_ids[] → 原文位置</text>
<text x="532" y="390" class="body" data-end-x="1020">retrieval_context_ids[] → 前提证据</text>
<rect x="512" y="480" width="528" height="220" rx="16" fill="#E8F3EF" stroke="#DCE4EE"/>
<text x="532" y="522" class="head" data-end-x="1020">原文位置</text>
<text x="532" y="549" class="file" data-end-x="1020">source_spans.jsonl</text>
<text x="532" y="584" class="body" data-end-x="1020">span_id：位置标识</text>
<text x="532" y="616" class="body" data-end-x="1020">document_id ＋ pdf_page</text>
<text x="532" y="648" class="body" data-end-x="1020">start_char / end_char ＋ exact原文</text>
<text x="532" y="680" class="body" data-end-x="1020">PDF哈希 / 页文本哈希 / 原文URL</text>
<rect x="1120" y="190" width="416" height="220" rx="16" fill="#F1EEFA" stroke="#DCE4EE"/>
<text x="1140" y="232" class="head" data-end-x="1516">条款关系</text>
<text x="1140" y="259" class="file" data-end-x="1516">relations.jsonl</text>
<text x="1140" y="294" class="body" data-end-x="1516">from_id / to_id → 证据标识</text>
<text x="1140" y="326" class="body" data-end-x="1516">kind：条件依赖 / 引用 / 定义</text>
<text x="1140" y="358" class="body" data-end-x="1516">basis_span_ids[] → 原文位置</text>
<rect x="1120" y="480" width="416" height="220" rx="16" fill="#EDF2FA" stroke="#DCE4EE"/>
<text x="1140" y="522" class="head" data-end-x="1516">检索索引</text>
<text x="1140" y="549" class="file" data-end-x="1516">lexical.json ＋ vectors.npy</text>
<text x="1140" y="584" class="body" data-end-x="1516">unit_ids[i] → evidence_unit_id</text>
<text x="1140" y="616" class="body" data-end-x="1516">token_counts[i]：关键词词频</text>
<text x="1140" y="648" class="body" data-end-x="1516">vectors[i]：同一证据的向量</text>
<text x="1140" y="680" class="body" data-end-x="1516">词频与向量按相同下标 i 对齐</text>
<path d="M224 480 V418" class="ref"/>
<text x="240" y="452" class="note">document_id</text>
<path d="M512 300 H392" class="ref"/>
<text x="448" y="279" class="note" text-anchor="middle">document_id</text>
<path d="M650 410 V472" class="ref"/>
<text x="670" y="451" class="note">source_span_ids[]</text>
<path d="M512 590 H392" class="ref"/>
<text x="448" y="570" class="note" text-anchor="middle">文档＋页码</text>
<path d="M1120 300 H1048" class="ref"/>
<path d="M1328 480 V448 H950 V418" class="ref"/>
<text x="1200" y="437" class="note" text-anchor="middle">unit_ids[i]</text>
<rect x="64" y="760" width="976" height="145" rx="16" fill="#FFFFFF" stroke="#DCE4EE"/>
<text x="88" y="802" class="head">版本与完整性</text>
<text x="88" y="843" class="body" data-end-x="1016">build_id → 索引manifest → 语料manifest → 来源与文件哈希</text>
<text x="88" y="880" class="note" data-end-x="1016">coverage.jsonl：按文档与页码登记收录区间、排除区间及原因。</text>
<rect x="1120" y="760" width="416" height="145" rx="16" fill="#FFF8EB" stroke="#DCE4EE"/>
<text x="1140" y="802" class="head" data-end-x="1516">会话状态 · 独立内存存储</text>
<text x="1140" y="838" class="note" data-end-x="1516">session_id → 用户原话 / 追问 / 修订号</text>
<text x="1140" y="878" class="body" data-end-x="1516">不写入知识库；进程重启后清空</text>
<text x="64" y="957" class="note">答案回查路径：证据ID → 原文位置 → PDF页。箭头表示逻辑关联，由应用校验。</text>
</svg>
